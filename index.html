<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>乐理游戏 · 节拍 + 音名（响应式）</title>
<style>
  /* ========== 全局重置与基础 ========== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(160deg, #FF6F91, #4FC3F7);
    min-height: 100vh;
    padding: 10px;
  }
  body { display: flex; justify-content: center; align-items: flex-start; }
  .app {
    width: 100%;
    max-width: 600px;
    background: rgba(255,255,255,0.95);
    border-radius: 30px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    border: 5px solid #fff;
    text-align: center;
  }
  .en {
    display: block;
    font-size: 0.7rem;
    font-weight: 600;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-top: 2px;
  }
  h2 { font-size: 1.4rem; margin-bottom: 4px; }
  /* ========== 大项目 / 小项目 层级导航 ========== */
  .project-select { display: block; }
  .project-select.hidden { display: none; }
  .project-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .project-card {
    display: flex; align-items: center; gap: 14px;
    width: 100%; border: 4px solid #fff; background: linear-gradient(135deg, #FFF0E8, #FFE3E8);
    color: #4A3B52; padding: 16px 18px; border-radius: 24px; cursor: pointer;
    box-shadow: 0 6px 0 rgba(209,154,46,0.35), 0 10px 20px rgba(0,0,0,0.12);
    transition: 0.15s; text-align: left;
  }
  .project-card:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(209,154,46,0.35), 0 6px 12px rgba(0,0,0,0.12); }
  .project-card .project-icon { font-size: 2.2rem; line-height: 1; }
  .project-card .project-body { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .project-card .project-title { font-size: 1.25rem; font-weight: 900; color: #4A3B52; }
  .project-card .project-title .en { display: inline; font-size: 0.7rem; color: #999; margin-left: 6px; }
  .project-card .project-sub { font-size: 0.85rem; font-weight: 700; color: #FF6F91; }

  .sub-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .back-btn {
    border: none; background: #FFE3E8; color: #4A3B52; font-size: 0.85rem; font-weight: 800;
    padding: 8px 14px; border-radius: 20px; cursor: pointer; transition: 0.2s;
    box-shadow: 0 3px 0 #E0A9B8;
  }
  .back-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #E0A9B8; }
  .sub-nav-title { font-size: 1rem; font-weight: 900; color: #4A3B52; }

  .panel { display: none; }
  .panel.active { display: block; }

  /* ========== 节拍游戏 ========== */
  .stage-select { display: flex; gap: 6px; margin-bottom: 10px; }
  .stage-btn {
    flex: 1; border: none; background: #FFF0E8; color: #4A3B52;
    font-size: 0.85rem; font-weight: 800; padding: 10px 2px;
    border-radius: 16px; cursor: pointer; transition: 0.2s;
  }
  .stage-btn.active { background: #FFD166; box-shadow: 0 2px 0 #D19A2E; }
  .level-info { font-size: 0.75rem; color: #999; font-weight: 700; margin-bottom: 10px; }
  .beat-note {
    background: #FFF0E8; border-radius: 18px; padding: 12px;
    border: 3px solid #FFD166; margin-bottom: 12px;
    display: flex; justify-content: center; align-items: center;
    gap: 12px; min-height: 120px;
  }
  .beat-row {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end;
    gap: 6px; margin-bottom: 12px; padding: 10px;
    background: #FFF0E8; border-radius: 18px; border: 3px solid #FFD166;
    min-height: 110px;
  }
  .beat-item {
    display: flex; flex-direction: column; align-items: center;
    background: rgba(255,255,255,0.7); border: 3px solid transparent;
    border-radius: 12px; padding: 6px 4px; transition: 0.2s;
  }
  .beat-item.current {
    border-color: #FF6F91; background: #FFE3E8;
    box-shadow: 0 0 10px rgba(255,111,145,0.5); transform: scale(1.05);
  }
  .beat-item .beat-label { font-size: 0.7rem; font-weight: 700; color: #4A3B52; margin-top: 2px; }
  .beat-keys {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; margin: 10px auto 12px; flex-wrap: wrap;
  }
  .beat-key {
    width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #FFF0B3, #FFD166 60%, #FFB347);
    border: none; box-shadow: 0 6px 0 #D19A2E, 0 8px 16px rgba(0,0,0,0.15);
    cursor: pointer; transition: 0.1s;
    font-size: 1.6rem; font-weight: 900; color: #4A3B52;
    display: flex; justify-content: center; align-items: center;
  }
  .beat-key:active { transform: translateY(3px); box-shadow: 0 3px 0 #D19A2E; }
  .beat-key.pressed {
    background: radial-gradient(circle at 30% 30%, #FFE9A8, #7ED9A8 70%, #5BC98A);
    box-shadow: 0 3px 0 #4FA97A; transform: translateY(3px);
  }
  .beat-key.wrong {
    background: radial-gradient(circle at 30% 30%, #FFD0D0, #FF8A8A 70%, #E57373);
    box-shadow: 0 3px 0 #C2555F; transform: translateY(3px);
  }
  .beat-message { font-size: 0.9rem; font-weight: 800; color: #4A3B52; min-height: 24px; }
  /* 认识时值：放大音符图标 */
  .beat-note .animal-part svg { width: 110px; height: auto; }
  .beat-note .note-part svg { width: 40px; height: auto; }
  .beat-item .animal-icon svg { width: 72px; height: auto; }
  .beat-item .note-icon svg { width: 30px; height: auto; }

  /* ========== 我是谁？ ========== */
  .level-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .level-tab {
    flex: 1; border: none; background: #FFE3E8; color: #4A3B52;
    font-size: 0.8rem; font-weight: 800; padding: 10px 2px;
    border-radius: 14px; cursor: pointer; transition: 0.2s;
    display: flex; flex-direction: column; align-items: center;
  }
  .level-tab.active { background: #FFD166; box-shadow: 0 2px 0 #D19A2E; }

  .song-select { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-bottom: 8px; }
  .song-btn {
    border: none; background: #FFF0E8; color: #4A3B52;
    font-size: 0.75rem; font-weight: 700; padding: 6px 8px;
    border-radius: 12px; cursor: pointer; transition: 0.2s;
    border: 1px solid transparent;
  }
  .song-btn.active { background: #FFD166; box-shadow: 0 2px 0 #D19A2E; border-color: #D19A2E; }

  .task-box {
    background: #FFE3E8; border-radius: 16px; padding: 10px;
    margin-bottom: 10px; font-size: 0.9rem; font-weight: 800; color: #4A3B52;
    min-height: 60px; display: flex; justify-content: center; align-items: center;
    gap: 4px; flex-wrap: wrap;
  }
  .task-box .highlight {
    background: #FFD166; border-radius: 8px; padding: 2px 6px; display: inline-block;
  }

  .animal-bar {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 6px; margin-bottom: 10px; padding: 8px;
    background: #FFF0E8; border-radius: 16px;
  }
  .drag-guide {
    font-size: 0.85rem; font-weight: 800; color: #FF6F91;
    margin: 0 0 8px; min-height: 22px;
  }
  .animal-item {
    background: #fff; border: 2px solid transparent; border-radius: 12px;
    padding: 4px 6px; cursor: grab; transition: 0.2s;
    display: flex; flex-direction: column; align-items: center;
    min-width: 50px; user-select: none; -webkit-user-select: none;
    touch-action: none; position: relative;
  }
  .animal-item.draggable-hint {
    animation: animalFloat 1.4s ease-in-out infinite;
    border-color: #FFD166;
  }
  .animal-item .drag-badge {
    position: absolute; top: -6px; right: -4px;
    background: #FF6F91; color: #fff; font-size: 0.55rem; font-weight: 800;
    border-radius: 8px; padding: 1px 4px; line-height: 1.2;
  }
  @keyframes animalFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .animal-item:active { cursor: grabbing; }
  .animal-item:hover { border-color: #FFD166; transform: translateY(-2px); }
  .animal-item.selected { border-color: #FF6F91; background: #FFE3E8; box-shadow: 0 2px 0 #D96C89; }
  .animal-item.dragging { opacity: 0.4; }
  .animal-item .animal-name { font-size: 0.7rem; font-weight: 700; color: #4A3B52; }
  .animal-item .animal-key { font-size: 0.6rem; color: #999; font-weight: 700; }
  .animal-item .animal-key .first-letter { font-size: 1.6em; font-weight: 900; color: #FF6F91; }
  .key-drop-feedback {
    position: absolute; pointer-events: none; z-index: 20;
    animation: dropPop 0.7s ease-out forwards;
  }
  @keyframes dropPop {
    0% { opacity: 0; transform: translate(-50%, -40%) scale(0.5); }
    30% { opacity: 1; transform: translate(-50%, -70%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -110%) scale(1); }
  }
  .drag-demo-ghost {
    position: fixed; z-index: 9998; pointer-events: none;
    transition: left 0.9s ease-in-out, top 0.9s ease-in-out, opacity 0.3s;
    opacity: 0.85;
  }

  .melody-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .melody-note {
    width: 30px; height: 30px; background: #FFF0E8;
    border-radius: 8px; display: flex; justify-content: center; align-items: center;
    font-size: 0.9rem; font-weight: 800; color: #4A3B52;
    border: 2px solid transparent;
  }
  .melody-note.current {
    border-color: #FF6F91; background: #FFD166;
    transform: scale(1.1);
  }
  .melody-note.done { background: #C8E6C9; border-color: #7ED9A8; }

  .keyboard-tip { font-size: 0.7rem; color: #888; margin: 6px 0; }
  .success-msg { font-size: 0.9rem; font-weight: 800; color: #FF6F91; min-height: 24px; margin-top: 4px; }
  .progress { color: #aaa; font-size: 0.7rem; font-weight: 700; margin-bottom: 6px; }

  /* ========== 自己创作音乐 ========== */
  .compose-bars { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .compose-label { font-size: 0.85rem; font-weight: 800; color: #4A3B52; }
  .compose-bar-btn {
    border: none; background: #FFF0E8; color: #4A3B52; font-size: 0.85rem; font-weight: 800;
    padding: 8px 14px; border-radius: 14px; cursor: pointer; transition: 0.2s;
  }
  .compose-bar-btn.active { background: #FFD166; box-shadow: 0 2px 0 #D19A2E; }
  .compose-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .compose-bar { background: #FFF0E8; border-radius: 14px; padding: 8px; }
  .compose-bar-label { font-size: 0.7rem; font-weight: 800; color: #999; margin-bottom: 4px; text-align: left; }
  .compose-bar-row { display: flex; gap: 6px; justify-content: center; }
  .compose-cell {
    width: 44px; height: 44px; border-radius: 10px; border: 2px dashed #E0C9A6;
    background: rgba(255,255,255,0.7); font-size: 1rem; font-weight: 900; color: #4A3B52;
    cursor: pointer; transition: 0.15s; display: flex; justify-content: center; align-items: center;
  }
  .compose-cell.filled { border-style: solid; border-color: #FFD166; background: #FFF0E8; }
  .compose-cell.cursor { border-color: #FF6F91; box-shadow: 0 0 8px rgba(255,111,145,0.5); }
  .compose-cell.playing { background: #FFD166; border-color: #FF6F91; transform: scale(1.08); }
  .compose-controls { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; flex-wrap: wrap; }
  .compose-btn {
    border: none; background: #FFE3E8; color: #4A3B52; font-size: 0.85rem; font-weight: 800;
    padding: 10px 16px; border-radius: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 3px 0 #E0A9B8;
  }
  .compose-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #E0A9B8; }
  .compose-btn.compose-play { background: #FFD166; box-shadow: 0 3px 0 #D19A2E; }
  .compose-btn.compose-play:active { box-shadow: 0 1px 0 #D19A2E; }
  .compose-status { font-size: 0.8rem; font-weight: 800; color: #FF6F91; min-height: 20px; }

  svg .key-white { cursor: pointer; transition: 0.1s; }
  svg .key-white:hover { fill: #FFE3E8; }
  svg .key-white.correct { fill: #7ED9A8; }
  svg .key-white.wrong { fill: #FFB3B3; }
  svg .key-white.shake { animation: shake 0.4s; }
  /* 作曲模式：琴键上的小动物图标 */
  .key-animal { display: none; pointer-events: none; }
  #keyboardSvg.show-animals .key-animal { display: block; }
  .key-animal svg { width: 40px; height: 40px; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  /* ========== 响应式适配 ========== */
  /* 手机（窄屏） */
  @media (max-width: 480px) {
    body { padding: 6px; align-items: flex-start; }
    .app {
      padding: 12px;
      border-radius: 20px;
      border-width: 4px;
      margin: 5px auto;
    }
    h2 { font-size: 1.1rem; }
    .project-card { padding: 14px 14px; gap: 10px; }
    .project-card .project-icon { font-size: 1.8rem; }
    .project-card .project-title { font-size: 1.05rem; }
    .level-tab { font-size: 0.7rem; padding: 8px 1px; }
    .level-tab .en { font-size: 0.55rem; }
    .task-box { font-size: 0.8rem; min-height: 55px; }
    .beat-key { width: 54px; height: 54px; font-size: 1.3rem; }
    .beat-keys { gap: 8px; }
    .animal-item { min-width: 42px; padding: 3px 4px; }
    .animal-item svg { width: 30px !important; height: 30px !important; }
    .melody-note { width: 26px; height: 26px; font-size: 0.75rem; }
    .keyboard-tip { font-size: 0.6rem; }
  }

  /* iPad / 平板（中等屏及以上） */
  @media (min-width: 481px) {
    .app { max-width: 880px; padding: 28px; }
    h2 { font-size: 2rem; }
    .project-card { padding: 20px 24px; gap: 16px; }
    .project-card .project-icon { font-size: 2.6rem; }
    .project-card .project-title { font-size: 1.5rem; }
    .stage-btn { font-size: 1.05rem; }
    .level-tab { font-size: 1rem; }
    .level-tab .en { font-size: 0.7rem; }
    .task-box { font-size: 1.15rem; }
    .animal-item { min-width: 76px; padding: 8px 10px; }
    .animal-item svg { width: 48px !important; height: 48px !important; }
    .animal-item .animal-name { font-size: 0.95rem; }
    .animal-item .animal-key { font-size: 0.8rem; }
    .melody-note { width: 42px; height: 42px; font-size: 1.1rem; }
    .beat-key { width: 88px; height: 88px; font-size: 2rem; }
    .keyboard-tip { font-size: 0.85rem; }
    .success-msg { font-size: 1.1rem; }
  }
</style>
</head>
<body>
<div class="app">
  <h2>🎵 乐理小游戏 <span class="en">Music Theory Game</span></h2>
  <!-- 大项目入口：卡片层 -->
  <div class="project-select" id="projectSelect">
    <div class="project-grid">
      <button class="project-card" id="projectBeat" data-project="beat">
        <span class="project-icon">🎵</span>
        <span class="project-body">
          <span class="project-title">节拍游戏 <span class="en">Beat Game</span></span>
          <span class="project-sub">认识时值 · 拍出节奏</span>
        </span>
      </button>
      <button class="project-card" id="projectKeyboard" data-project="keyboard">
        <span class="project-icon">🐸</span>
        <span class="project-body">
          <span class="project-title">我是谁？ <span class="en">Who Am I?</span></span>
          <span class="project-sub">认识音名 · 玩转钢琴</span>
        </span>
      </button>
    </div>
  </div>

  <!-- 节拍游戏面板 -->
  <div class="panel" id="beatPanel">
    <div class="sub-nav">
      <button class="back-btn" data-back>← 项目</button>
      <span class="sub-nav-title">🎵 节拍游戏</span>
    </div>
    <div class="stage-select">
      <button class="stage-btn active" data-stage="learn">认识时值 <span class="en">Learn Values</span></button>
      <button class="stage-btn" data-stage="random">随机排列 <span class="en">Random Order</span></button>
    </div>
    <div class="level-info" id="beatLevelInfo"></div>
    <div id="beatDisplayArea"></div>
    <div class="beat-keys" id="beatKeys">
      <button class="beat-key" data-n="1">1</button>
      <button class="beat-key" data-n="2">2</button>
      <button class="beat-key" data-n="3">3</button>
      <button class="beat-key" data-n="4">4</button>
    </div>
    <div class="beat-message" id="beatMsg"></div>
  </div>

  <!-- 我是谁？三关面板 -->
  <div class="panel" id="keyboardPanel">
    <div class="sub-nav">
      <button class="back-btn" data-back>← 项目</button>
      <span class="sub-nav-title">🐸 我是谁？</span>
    </div>
    <div class="level-tabs">
      <button class="level-tab active" data-kb-level="1">认识音名 <span class="en">Learn Notes</span></button>
      <button class="level-tab" data-kb-level="2">帮我找位置 <span class="en">Find Position</span></button>
      <button class="level-tab" data-kb-level="3">旋律游戏 <span class="en">Melody Game</span></button>
      <button class="level-tab" data-kb-level="4">自己创作 <span class="en">Compose</span></button>
    </div>

    <div id="kbTaskArea">
      <div class="song-select" id="songSelect" style="display:none;"></div>
      <div class="progress" id="progress"></div>
      <div class="task-box" id="taskBox"></div>
      <div class="drag-guide" id="dragGuide"></div>
      <div class="melody-row" id="melodyRow" style="display:none;"></div>
      <div class="animal-bar" id="animalBar"></div>
      <div id="composeArea" style="display:none;">
        <div class="compose-bars">
          <span class="compose-label">选择小节数：</span>
          <button class="compose-bar-btn active" data-bars="4">4 小节</button>
          <button class="compose-bar-btn" data-bars="6">6 小节</button>
          <button class="compose-bar-btn" data-bars="8">8 小节</button>
        </div>
        <div class="compose-grid" id="composeGrid"></div>
        <div class="compose-controls">
          <button class="compose-btn" id="composeBack">← 后退</button>
          <button class="compose-btn" id="composeClear">清空</button>
          <button class="compose-btn compose-play" id="composePlay">▶ AI 演奏</button>
        </div>
        <div class="compose-status" id="composeStatus"></div>
      </div>
    </div>

    <svg id="keyboardSvg" viewBox="0 0 560 180" style="width:100%; height:auto;">
      <rect x="10"  y="20" width="70" height="140" rx="4" class="key-white" data-key="C4" fill="#fff" stroke="#333" stroke-width="2"/>
      <rect x="85"  y="20" width="70" height="140" rx="4" class="key-white" data-key="D"  fill="#fff" stroke="#333" stroke-width="2"/>
      <rect x="160" y="20" width="70" height="140" rx="4" class="key-white" data-key="E"  fill="#fff" stroke="#333" stroke-width="2"/>
      <rect x="235" y="20" width="70" height="140" rx="4" class="key-white" data-key="F"  fill="#fff" stroke="#333" stroke-width="2"/>
      <rect x="310" y="20" width="70" height="140" rx="4" class="key-white" data-key="G"  fill="#fff" stroke="#333" stroke-width="2"/>
      <rect x="385" y="20" width="70" height="140" rx="4" class="key-white" data-key="A"  fill="#fff" stroke="#333" stroke-width="2"/>
      <rect x="460" y="20" width="70" height="140" rx="4" class="key-white" data-key="B"  fill="#fff" stroke="#333" stroke-width="2"/>
      <rect x="55"  y="20" width="45" height="85" rx="5" fill="#333"/>
      <rect x="130" y="20" width="45" height="85" rx="5" fill="#333"/>
      <rect x="280" y="20" width="45" height="85" rx="5" fill="#333"/>
      <rect x="355" y="20" width="45" height="85" rx="5" fill="#333"/>
      <rect x="430" y="20" width="45" height="85" rx="5" fill="#333"/>
      <foreignObject class="key-animal" data-animal="cat" x="20" y="106" width="50" height="46"></foreignObject>
      <foreignObject class="key-animal" data-animal="dog" x="95" y="106" width="50" height="46"></foreignObject>
      <foreignObject class="key-animal" data-animal="elephant" x="170" y="106" width="50" height="46"></foreignObject>
      <foreignObject class="key-animal" data-animal="fox" x="245" y="106" width="50" height="46"></foreignObject>
      <foreignObject class="key-animal" data-animal="goat" x="320" y="106" width="50" height="46"></foreignObject>
      <foreignObject class="key-animal" data-animal="ant" x="395" y="106" width="50" height="46"></foreignObject>
      <foreignObject class="key-animal" data-animal="bear" x="470" y="106" width="50" height="46"></foreignObject>
      <text x="45" y="175" font-size="18" font-weight="bold" fill="#FF6F91" text-anchor="middle">C</text>
      <text x="120" y="175" font-size="16" fill="#888" text-anchor="middle">D</text>

<script>
// ========== 音频系统 ==========
let audioCtx = null;
function playBeep(freq, dur) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function playNote(noteName, dur = 0.3) {
  const freqs = { 'C4': 262, 'D': 294, 'E': 330, 'F': 349, 'G': 392, 'A': 440, 'B': 494 };
  playBeep(freqs[noteName] || 262, dur);
}
function speakLetter(noteName) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const letter = noteName === 'C4' ? 'C' : noteName;
    const u = new SpeechSynthesisUtterance(letter);
    u.lang = 'en-US';
    u.rate = 0.7;
    u.pitch = 1.2;
    u.volume = 0.15;
    speechSynthesis.speak(u);
  }
}
function speakNumber(n) {
  const texts = ['one','two','three','four','five'];
  if (n < 1 || n > texts.length) return;
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texts[n-1]);
    u.lang = 'en-US';
    u.rate = 0.8;
    u.pitch = 1.2;
    u.volume = 0.5;
    speechSynthesis.speak(u);
  }
}

// ========== 节拍游戏 ==========
const beatNotePool = {
  quarter: { name:'四分音符', taps:1, animalSvg:`<svg width="50" height="42" viewBox="0 0 90 70"><path d="M 32 38 Q 58 32 72 16 Q 62 38 78 48 Q 56 40 32 44 Z" fill="#333"/><ellipse cx="26" cy="38" rx="20" ry="16" fill="#333"/><circle cx="19" cy="32" r="3" fill="#fff"/><circle cx="33" cy="32" r="3" fill="#fff"/><circle cx="12" cy="43" r="4" fill="#FF6F91" opacity="0.7"/><circle cx="40" cy="43" r="4" fill="#FF6F91" opacity="0.7"/></svg>`, noteSvg:`<svg width="14" height="34" viewBox="0 0 20 44"><ellipse cx="8" cy="32" rx="7" ry="5" fill="#333"/><rect x="14" y="6" width="3" height="28" fill="#333"/></svg>` },
  half: { name:'二分音符', taps:2, animalSvg:`<svg width="50" height="42" viewBox="0 0 90 70"><path d="M 32 38 Q 58 32 72 16 Q 62 38 78 48 Q 56 40 32 44 Z" fill="#333"/><ellipse cx="26" cy="38" rx="20" ry="16" fill="#fff" stroke="#333" stroke-width="3"/><circle cx="19" cy="32" r="3" fill="#333"/><circle cx="33" cy="32" r="3" fill="#333"/><circle cx="12" cy="43" r="4" fill="#FF6F91" opacity="0.8"/><circle cx="40" cy="43" r="4" fill="#FF6F91" opacity="0.8"/><path d="M 20 44 Q 26 48 32 44" stroke="#333" stroke-width="2" fill="none"/></svg>`, noteSvg:`<svg width="14" height="34" viewBox="0 0 20 44"><ellipse cx="8" cy="32" rx="7" ry="5" fill="#fff" stroke="#333" stroke-width="2.5"/><rect x="14" y="6" width="3" height="28" fill="#333"/></svg>` },
  dottedHalf: { name:'附点二分音符', taps:3, animalSvg:`<svg width="50" height="42" viewBox="0 0 90 70"><path d="M 32 38 Q 58 32 72 16 Q 62 38 78 48 Q 56 40 32 44 Z" fill="#333"/><ellipse cx="26" cy="38" rx="20" ry="16" fill="#fff" stroke="#333" stroke-width="3"/><circle cx="19" cy="32" r="3" fill="#333"/><circle cx="33" cy="32" r="3" fill="#333"/><path d="M 20 44 Q 26 48 32 44" stroke="#333" stroke-width="2" fill="none"/><circle cx="37" cy="41" r="3.5" fill="#333"/></svg>`, noteSvg:`<svg width="20" height="34" viewBox="0 0 28 44"><ellipse cx="8" cy="32" rx="7" ry="5" fill="#fff" stroke="#333" stroke-width="2.5"/><rect x="14" y="6" width="3" height="28" fill="#333"/><circle cx="22" cy="36" r="4" fill="#333"/></svg>` },
  whole: { name:'全音符', taps:4, animalSvg:`<svg width="50" height="46" viewBox="0 0 90 80"><ellipse cx="45" cy="68" rx="38" ry="10" fill="#7ED9A8" stroke="#333" stroke-width="2"/><ellipse cx="45" cy="48" rx="24" ry="20" fill="#8EE5B1" stroke="#333" stroke-width="2"/><circle cx="30" cy="32" r="12" fill="#8EE5B1" stroke="#333" stroke-width="2"/><circle cx="60" cy="32" r="12" fill="#8EE5B1" stroke="#333" stroke-width="2"/><circle cx="32" cy="33" r="5" fill="#333"/><circle cx="58" cy="33" r="5" fill="#333"/><circle cx="35" cy="31" r="2" fill="#fff"/><circle cx="61" cy="31" r="2" fill="#fff"/><path d="M 34 52 Q 45 60 56 52" stroke="#333" stroke-width="2" fill="none"/><circle cx="25" cy="46" r="5" fill="#FF6F91" opacity="0.8"/><circle cx="65" cy="46" r="5" fill="#FF6F91" opacity="0.8"/></svg>`, noteSvg:`<svg width="16" height="28" viewBox="0 0 24 36"><ellipse cx="12" cy="22" rx="9" ry="7" fill="#fff" stroke="#333" stroke-width="2.5"/></svg>` }
};
function buildLearnQuestions() {
  const seq = ['quarter','half','dottedHalf','whole'];
  return seq.map((key,i)=>({noteKey:key, groupId:undefined, groupNotes:[key], noteIndex:0, groupLabel:`认识时值 ${i+1} / ${seq.length}`}));
}
function buildRandomGroupQuestions() {
  const pool = ['quarter','half','dottedHalf','whole'];
  const sizes = [2,3,4,2,3,4];
  const questions = [];
  sizes.forEach((size,gi)=>{
    const shuffled = [...pool].sort(()=>Math.random()-0.5);
    const group = shuffled.slice(0,size);
    group.forEach((noteKey,ni)=>{
      questions.push({noteKey, groupId:gi, groupSize:size, noteIndex:ni, groupNotes:group, groupLabel:`第 ${gi+1}/${sizes.length} 组 · ${size}个音符 · 音符 ${ni+1}/${size}`});
    });
  });
  return questions;
}
let beatState = { questions:[], currentIndex:0, tapCount:0, busy:false };
const beatDisplayArea = document.getElementById('beatDisplayArea');
const beatMsg = document.getElementById('beatMsg');
const beatLevelInfo = document.getElementById('beatLevelInfo');
const beatKeyButtons = Array.from(document.querySelectorAll('.beat-key'));
function resetBeatKeys() {
  beatKeyButtons.forEach(k => k.classList.remove('pressed', 'wrong'));
}
function renderBeat() {
  if (!beatState.questions.length) return;
  const q = beatState.questions[beatState.currentIndex];
  const note = beatNotePool[q.noteKey];
  if (q.groupId !== undefined && q.groupNotes.length > 1) {
    const rowHtml = q.groupNotes.map((nk,i)=>{
      const n = beatNotePool[nk];
      const isCurrent = i === q.noteIndex;
      return `<div class="beat-item ${isCurrent?'current':''}"><div class="animal-icon">${n.animalSvg}</div><div class="note-icon">${n.noteSvg}</div><div class="beat-label">${isCurrent?'👆 '+n.name:n.name}</div></div>`;
    }).join('');
    beatDisplayArea.innerHTML = `<div class="beat-row">${rowHtml}</div>`;
  } else {
    beatDisplayArea.innerHTML = `<div class="beat-note"><div class="animal-part">${note.animalSvg}</div><div class="note-part">${note.noteSvg}</div></div>`;
  }
  beatLevelInfo.textContent = q.groupLabel;
  beatMsg.innerHTML = '';
  beatState.tapCount = 0;
  beatState.busy = false;
  resetBeatKeys();
}
function handleBeatKey(n) {
  if (beatState.busy || !beatState.questions.length) return;
  const q = beatState.questions[beatState.currentIndex];
  const note = beatNotePool[q.noteKey];
  // 必须按顺序：1 → 2 → 3 → 4
  if (n !== beatState.tapCount + 1) {
    beatState.busy = true;
    const expected = beatState.tapCount + 1;
    beatMsg.innerHTML = `❌ 顺序不对，下一个应是 ${expected} <span class="en">Wrong — next is ${expected}</span>`;
    playBeep(200,0.3);
    beatKeyButtons.forEach(k => { if (k.dataset.n == n) k.classList.add('wrong'); });
    setTimeout(()=>renderBeat(),800);
    return;
  }
  beatState.tapCount++;
  playBeep(600,0.1);
  if (beatState.tapCount <= note.taps) speakNumber(beatState.tapCount);
  beatKeyButtons.forEach(k => { if (k.dataset.n == n) k.classList.add('pressed'); });
  if (beatState.tapCount === note.taps) {
    beatState.busy = true;
    playBeep(880,0.2);
    const nextQ = beatState.questions[beatState.currentIndex+1];
    if (!nextQ) {
      beatMsg.innerHTML = '🎉 全部完成！<span class="en">All done!</span>';
      setTimeout(()=>{ beatState.currentIndex=0; renderBeat(); },1500);
    } else if (q.groupId !== undefined && nextQ.groupId !== q.groupId) {
      beatMsg.innerHTML = '🎉 本组完成！<span class="en">Group completed!</span>';
      setTimeout(()=>{ beatState.currentIndex++; renderBeat(); },1000);
    } else {
      beatMsg.innerHTML = '✅ 过关！<span class="en">Great!</span>';
      setTimeout(()=>{ beatState.currentIndex++; renderBeat(); },1000);
    }
  }
}
beatKeyButtons.forEach(btn=>{
  btn.addEventListener('click', ()=> handleBeatKey(parseInt(btn.dataset.n)));
});
function loadBeatStage(stage) {
  if (stage === 'learn') beatState.questions = buildLearnQuestions();
  else if (stage === 'random') beatState.questions = buildRandomGroupQuestions();
  beatState.currentIndex = 0;
  renderBeat();
}
document.querySelectorAll('#beatPanel .stage-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#beatPanel .stage-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    loadBeatStage(btn.dataset.stage);
  });
});

        successMsg.innerHTML = `已选 ${data.name}，请拖到琴键上（或再点琴键） <span class="en">Selected ${data.en} — drag onto a key</span>`;
      } else {
        successMsg.innerHTML = `选择了 ${data.name}（${data.en}） <span class="en">Selected ${data.en}</span>`;
      }
    });
    item.addEventListener('pointerdown', (e) => { onAnimalPointerDown(k, e); });
    container.appendChild(item);
  });
}

function showDropFeedback(animalKey, keyElement) {
  const rect = keyElement.getBoundingClientRect();
  const feedback = document.createElement('div');
  feedback.className = 'key-drop-feedback';
  feedback.innerHTML = animalData[animalKey].svg;
  feedback.style.left = (rect.left + rect.width / 2) + 'px';
  feedback.style.top = (rect.top + rect.height * 0.35) + 'px';
  document.body.appendChild(feedback);
  setTimeout(() => feedback.remove(), 700);
}

function playDragDemo() {
  if (hasShownDragDemo || currentKbLevel < 2) return;
  if (!panelKeyboard.classList.contains('active')) return; // 面板隐藏时不消耗演示机会
  hasShownDragDemo = true;
  const firstAnimal = document.querySelector('.animal-item');
  const targetKey = document.querySelector('.key-white');
  if (!firstAnimal || !targetKey) return;
  const from = firstAnimal.getBoundingClientRect();
  const to = targetKey.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = 'drag-demo-ghost';
  ghost.innerHTML = animalData[firstAnimal.dataset.animal].svg;
  ghost.style.left = (from.left + from.width / 2) + 'px';
  ghost.style.top = (from.top + from.height / 2) + 'px';
  ghost.style.transform = 'translate(-50%, -50%)';
  document.body.appendChild(ghost);
  requestAnimationFrame(() => {
    ghost.style.left = (to.left + to.width / 2) + 'px';
    ghost.style.top = (to.top + to.height / 2) + 'px';
  });
  setTimeout(() => {
    ghost.style.opacity = '0';
    setTimeout(() => ghost.remove(), 300);
  }, 1000);
}

function highlightKey(keyName) {
  keys.forEach(k => { k.setAttribute('fill', '#fff'); k.classList.remove('correct', 'wrong', 'shake'); });
  if (!keyName) return;
  const target = document.querySelector(`.key-white[data-key="${keyName}"]`);
  if (target) target.setAttribute('fill', '#FFD166');
}

function renderTask() {
  const task = currentTasks[taskIndex];
  const a = animalData[task.animalKey];
  const keyName = task.key === 'C4' ? 'C (中央C)' : task.key;
  let zhHtml, enText;
  if (currentKbLevel === 1) {
    zhHtml = `<span>记住：</span><span class="highlight">${a.name} (${a.en})</span><span>= ${keyName}键</span>`;
    enText = `Remember: ${a.en} = ${task.key === 'C4' ? 'C (Middle C)' : task.key} key`;
    progress.innerHTML = `第 ${taskIndex + 1} / ${currentTasks.length} · 认识音名 <span class="en">Question ${taskIndex + 1} / ${currentTasks.length}</span>`;
  } else {
    zhHtml = `<span>拖动</span><span class="highlight">${a.name} ${a.en}</span><span>到</span><span class="highlight">${keyName}</span><span>键上</span>`;
    enText = `Drag ${a.en} onto ${task.key === 'C4' ? 'C' : task.key} key`;
    progress.innerHTML = `第 ${taskIndex + 1} / ${currentTasks.length} · 帮我找位置 <span class="en">Question ${taskIndex + 1} / ${currentTasks.length}</span>`;
  }
  taskBox.innerHTML = `${zhHtml}<span class="en" style="width:100%;">${enText}</span>`;
  updateDragGuides();
  successMsg.innerHTML = '';
  selectedAnimal = null;
  isBusy = false;
  document.querySelectorAll('.animal-item').forEach(el => el.classList.remove('selected'));
  highlightKey(null);
}

function getCurrentSegmentTasks() {
  const song = songList[currentSongIndex];
  return song.segments[currentSegmentIndex].map(noteToTask);
}

function renderMelody(silent) {
  const tasks = getCurrentSegmentTasks();
  const song = songList[currentSongIndex];
  melodyRow.innerHTML = '';
  tasks.forEach((note, index) => {
    const div = document.createElement('div');
    div.className = 'melody-note' + (index === taskIndex ? ' current' : (index < taskIndex ? ' done' : ''));
    div.textContent = note.key === 'C4' ? 'C' : note.key;
    melodyRow.appendChild(div);
  });
  const currentTask = tasks[taskIndex];
  const a = animalData[currentTask.animalKey];
  const segmentLabel = `第 ${currentSegmentIndex + 1}/${song.segments.length} 段`;
  const keyLabel = currentTask.key === 'C4' ? 'C' : currentTask.key;
  taskBox.innerHTML = `<span>【${song.name}】${segmentLabel}，拖动</span><span class="highlight">${a.name} (${a.en})</span><span>到亮起的琴键上</span><span class="en" style="width:100%;">Song: ${song.enName} · Drag ${a.en} onto ${keyLabel}</span>`;
  progress.innerHTML = `第 ${taskIndex + 1} / ${tasks.length} 个音 · ${segmentLabel} <span class="en">Note ${taskIndex + 1} / ${tasks.length} · ${song.enName}</span>`;
  updateDragGuides();
  highlightKey(currentTask.key);
  if (!silent && panelKeyboard.classList.contains('active')) playNote(currentTask.key, 0.3);
  successMsg.innerHTML = '';
  selectedAnimal = null;
  isBusy = false;
  document.querySelectorAll('.animal-item').forEach(el => el.classList.remove('selected'));
}

function playMelodySequence(notes, durations, onNote, onDone, extraTailMs) {
  isBusy = true;
  let delay = 0;
  notes.forEach((noteName, i) => {
    const beats = durations[i] || 1;
    const noteDurSec = Math.min(2.0, (beats * MELODY_BEAT_MS) / 1000 * 0.85);
    kbSetTimeout(() => {
      if (onNote) onNote(noteName, i);
      highlightKey(noteName);
      playNote(noteName, noteDurSec);
    }, delay);
    delay += beats * MELODY_BEAT_MS;
  });
  kbSetTimeout(() => { if (onDone) onDone(); }, delay + (extraTailMs || 400));
}

function afterSegmentDemo(silent) {
  isPlayingSegmentDemo = false;
  const song = songList[currentSongIndex];
  if (currentSegmentIndex + 1 < song.segments.length) {
    currentSegmentIndex++;
    taskIndex = 0;
    renderMelody(silent);
    if (!silent) {
      successMsg.innerHTML = `✅ 本段完成！进入下一段！<span class="en">Segment done! Next segment!</span>`;
    }
  } else if (!silent && panelKeyboard.classList.contains('active')) {
    playFullMelody();
  } else {
    currentSongIndex = (currentSongIndex + 1) % songList.length;
    currentSegmentIndex = 0;
    taskIndex = 0;
    updateSongButtons();
    renderMelody(true);
  }
}

function playSegmentMelody() {
  const song = songList[currentSongIndex];
  const notes = song.segments[currentSegmentIndex];
  const start = currentSegmentIndex * 4;
  const allDurations = song.durationBeats || song.notes.map(() => 1);
  const durations = allDurations.slice(start, start + notes.length);
  isPlayingSegmentDemo = true;
  successMsg.innerHTML = `🎵 听一听这一段～ <span class="en">Listen to this part</span>`;
  [...melodyRow.children].forEach(el => {
    el.classList.remove('current');
    el.classList.add('done');
  });
  playMelodySequence(notes, durations, (_noteName, i) => {
    [...melodyRow.children].forEach((el, idx) => {
      el.classList.toggle('current', idx === i);
      el.classList.toggle('done', idx < i);
    });
  }, () => {
    isPlayingSegmentDemo = false;
    afterSegmentDemo(false);
  }, 500);
}

function playFullMelody() {
  const song = songList[currentSongIndex];
  const durations = song.durationBeats || song.notes.map(() => 1);
  isPlayingFullMelody = true;
  successMsg.innerHTML = `🎉 太棒了！整首再听一遍《${song.name}》～ <span class="en">Great! Listen to the whole ${song.enName}</span>`;
  playMelodySequence(song.notes, durations, null, () => {
    isPlayingFullMelody = false;
    currentSongIndex = (currentSongIndex + 1) % songList.length;
    currentSegmentIndex = 0;
    taskIndex = 0;
    updateSongButtons();
    successMsg.innerHTML = `⭐ 进入下一首：${songList[currentSongIndex].name} <span class="en">Next: ${songList[currentSongIndex].enName}</span>`;
    renderMelody();
  }, 800);
}

function handlePlace(animalKey, keyElement) {
  if (isBusy) return;
  let currentTask;
  if (currentKbLevel === 3) {
    const tasks = getCurrentSegmentTasks();
    currentTask = tasks[taskIndex];
  } else {
    currentTask = currentTasks[taskIndex];
  }
  const a = animalData[animalKey];
  const target = animalData[currentTask.animalKey];
  const keyLabel = currentTask.key === 'C4' ? 'C' : currentTask.key;
  if (animalKey !== currentTask.animalKey) {
    successMsg.innerHTML = `❌ 动物不对：不是${a.name}，要找${target.name} <span class="en">Wrong animal: find ${target.en}</span>`;
    keyElement.classList.add('shake');
    playBeep(200, 0.25);
    kbSetTimeout(() => keyElement.classList.remove('shake'), 400);
    return;
  }
  if (keyElement.dataset.key === currentTask.key) {
    isBusy = true;
    keyElement.classList.add('correct');
    keyElement.setAttribute('fill', '#7ED9A8');
    showDropFeedback(animalKey, keyElement);
    playBeep(880, 0.15); kbSetTimeout(() => playBeep(1100, 0.18), 180);
    successMsg.innerHTML = `✅ 匹配成功！${a.name}放到了 ${keyLabel} 键 <span class="en">Match! ${a.en} on ${keyLabel}</span>`;
    if (currentKbLevel === 3) playNote(currentTask.key, 0.35);
    kbSetTimeout(() => {
      taskIndex++;
      if (currentKbLevel === 3) {
        const tasks = getCurrentSegmentTasks();
        if (taskIndex >= tasks.length) {
          if (panelKeyboard.classList.contains('active')) {
            playSegmentMelody();
          } else {
            afterSegmentDemo(true);
          }
        } else {
          renderMelody();
        }
      } else {
        if (taskIndex >= currentTasks.length) {
          taskIndex = 0;
          if (currentKbLevel === 1) {
            switchKbLevel(2);
            successMsg.innerHTML = `✅ 认识音名完成！开始帮我找位置吧！<span class="en">Learned! Find the position!</span>`;
            return;
          } else {
            currentTasks = shuffleTasks();
            taskIndex = 0;
            successMsg.innerHTML = `🎉 全部完成！再来一轮！<span class="en">All done! Another round!</span>`;
          }
        }
        renderTask();
      }
    }, 1300);
  } else {
    keyElement.classList.add('wrong', 'shake');
    keyElement.setAttribute('fill', '#FFB3B3');
    playBeep(200, 0.25);
    successMsg.innerHTML = `❌ 琴键不对：${a.name}要放到 ${keyLabel} 键 <span class="en">Wrong key — put ${a.en} on ${keyLabel}</span>`;
    kbSetTimeout(() => {
      keyElement.classList.remove('shake', 'wrong');
      keyElement.setAttribute('fill', '#fff');
      if (currentKbLevel === 3) highlightKey(currentTask.key);
    }, 600);
  }
}

function updateSongButtons() {
  const btns = document.querySelectorAll('.song-btn');
  btns.forEach((btn, i) => btn.classList.toggle('active', i === currentSongIndex));
}
function buildSongSelect() {
  songSelect.innerHTML = '';
  songList.forEach((song, i) => {
    const btn = document.createElement('button');
    btn.className = 'song-btn' + (i === currentSongIndex ? ' active' : '');
    btn.innerHTML = song.name + `<span class="en">${song.enName}</span>`;
    btn.dataset.index = i;
    btn.addEventListener('click', () => {
      if (isBusy) return;
      currentSongIndex = i;
      currentSegmentIndex = 0;
      taskIndex = 0;
      updateSongButtons();
      renderMelody();
    });
    songSelect.appendChild(btn);
  });
}

// ========== 自己创作音乐 ==========
const composeArea = document.getElementById('composeArea');
const composeGrid = document.getElementById('composeGrid');
const composeStatus = document.getElementById('composeStatus');
const composeBackBtn = document.getElementById('composeBack');
const composeClearBtn = document.getElementById('composeClear');
const composePlayBtn = document.getElementById('composePlay');
const NOTE_LABEL = { 'C4':'C', 'D':'D', 'E':'E', 'F':'F', 'G':'G', 'A':'A', 'B':'B' };
let composeState = { bars: 4, notes: [], cursor: 0, playing: false };

function initCompose() {
  composeState.notes = new Array(composeState.bars * 4).fill(null);
  composeState.cursor = 0;
  composeState.playing = false;
  renderComposeGrid();
  updateComposeStatus();
}
function renderComposeGrid() {
  composeGrid.innerHTML = '';
  for (let bar = 0; bar < composeState.bars; bar++) {
    const barEl = document.createElement('div');
    barEl.className = 'compose-bar';
    const barLabel = document.createElement('div');
    barLabel.className = 'compose-bar-label';
    barLabel.textContent = `第 ${bar + 1} 小节`;
    barEl.appendChild(barLabel);
    const row = document.createElement('div');
    row.className = 'compose-bar-row';
    for (let beat = 0; beat < 4; beat++) {
      const idx = bar * 4 + beat;
      const note = composeState.notes[idx];
      const cell = document.createElement('button');
      cell.className = 'compose-cell' + (note ? ' filled' : '') + (idx === composeState.cursor ? ' cursor' : '');
      cell.dataset.idx = idx;
      cell.textContent = note ? NOTE_LABEL[note] : '';
      cell.addEventListener('click', () => {
        if (composeState.playing) return;
        composeState.cursor = idx;
        renderComposeGrid();
        updateComposeStatus();
      });
      row.appendChild(cell);
    }
    barEl.appendChild(row);
    composeGrid.appendChild(barEl);
  }
}
function updateComposeStatus() {
  const filled = composeState.notes.filter(Boolean).length;
  const bar = Math.floor(composeState.cursor / 4) + 1;
  const beat = (composeState.cursor % 4) + 1;
  composeStatus.innerHTML = `已填 ${filled} / ${composeState.notes.length} 个音 · 当前：第 ${bar} 小节第 ${beat} 拍 <span class="en">Tap a piano key to fill the current beat</span>`;
}
function handleComposeKey(keyName) {
  if (composeState.playing) return;
  if (composeState.cursor >= composeState.notes.length) return;
  composeState.notes[composeState.cursor] = keyName;
  playNote(keyName, 0.25);
  composeState.cursor = Math.min(composeState.cursor + 1, composeState.notes.length);
  renderComposeGrid();
  updateComposeStatus();
}
function composeBack() {
  if (composeState.playing) return;
  if (composeState.cursor > 0) composeState.cursor--;
  composeState.notes[composeState.cursor] = null;
  renderComposeGrid();
  updateComposeStatus();
}
function composeClear() {
  if (composeState.playing) return;
  composeState.notes = new Array(composeState.bars * 4).fill(null);
  composeState.cursor = 0;
  renderComposeGrid();
  updateComposeStatus();
}
function composePlay() {
  const filled = [];
  composeState.notes.forEach((n, i) => { if (n) filled.push({ note: n, idx: i }); });
  if (!filled.length) {
    composeStatus.innerHTML = '请先填入音符 <span class="en">Please add some notes first</span>';
    return;
  }
  if (composeState.playing) return;
  composeState.playing = true;
  composeStatus.innerHTML = '🎵 AI 演奏中… <span class="en">Playing your melody…</span>';
  const notes = filled.map(f => f.note);
  const idxs = filled.map(f => f.idx);
  playMelodySequence(notes, notes.map(() => 1), (_n, i) => {
    highlightComposeCell(idxs[i]);
  }, () => {
    composeState.playing = false;
    isBusy = false;
    renderComposeGrid();
    composeStatus.innerHTML = '✅ 演奏完成！<span class="en">Finished!</span>';
  }, 500);
}
function highlightComposeCell(idx) {
  const cells = composeGrid.querySelectorAll('.compose-cell');
  cells.forEach((c, i) => c.classList.toggle('playing', i === idx));
}
document.querySelectorAll('.compose-bar-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (composeState.playing) return;
    document.querySelectorAll('.compose-bar-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    composeState.bars = parseInt(btn.dataset.bars);
    initCompose();
  });
});
composeBackBtn.addEventListener('click', composeBack);
composeClearBtn.addEventListener('click', composeClear);
composePlayBtn.addEventListener('click', composePlay);

function switchKbLevel(level) {
  clearKbTimers();
  isPlayingFullMelody = false;
  isPlayingSegmentDemo = false;
  composeState.playing = false;
  currentKbLevel = level;
  document.querySelectorAll('.level-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.kbLevel == level));
  isBusy = false;
  taskIndex = 0;
  selectedAnimal = null;
  // 恢复默认显示
  taskBox.style.display = '';
  dragGuide.style.display = '';
  progress.style.display = '';
  animalBar.style.display = '';
  composeArea.style.display = 'none';
  document.getElementById('keyboardSvg').classList.remove('show-animals');
  if (level === 1) {
    currentTasks = [...taskPool];
    songSelect.style.display = 'none';
    melodyRow.style.display = 'none';
    buildAnimalBar(animalBar);
    renderTask();
  } else if (level === 2) {
    currentTasks = shuffleTasks();
    songSelect.style.display = 'none';
    melodyRow.style.display = 'none';
    buildAnimalBar(animalBar);
    renderTask();
    setTimeout(playDragDemo, 400);
  } else if (level === 3) {
    songSelect.style.display = 'flex';
    melodyRow.style.display = 'flex';
    buildSongSelect();
    buildAnimalBar(animalBar);
    currentSegmentIndex = 0;
    taskIndex = 0;
    renderMelody();
  } else if (level === 4) {
    songSelect.style.display = 'none';
    melodyRow.style.display = 'none';
    animalBar.style.display = 'none';
    taskBox.style.display = 'none';
    dragGuide.style.display = 'none';
    progress.style.display = 'none';
    keyboardTip.innerHTML = '点琴键，把音名填到当前拍 <span class="en">Tap a key to fill the current beat</span>';
    successMsg.innerHTML = '';
    composeArea.style.display = 'block';
    document.getElementById('keyboardSvg').classList.add('show-animals');
    initCompose();
  }
}

document.querySelectorAll('.level-tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    switchKbLevel(parseInt(btn.dataset.kbLevel));
  });
});

keys.forEach(key=>{
  key.addEventListener('click',()=>{
    if (isBusy) return;
    if (currentKbLevel === 4) {
      handleComposeKey(key.dataset.key);
      return;
    }
    if (!selectedAnimal) {
      successMsg.innerHTML = `请先选一只小动物 <span class="en">Please choose an animal first</span>`;
      key.classList.add('shake');
      setTimeout(()=>key.classList.remove('shake'),400);
      return;
    }
    handlePlace(selectedAnimal, key);
  });
});

// ========== 触摸拖拽（手机/iPad） ==========
let touchDragAnimal = null, touchDragClone = null, touchDragStartX = 0, touchDragStartY = 0, touchDragActive = false, touchDragPointerId = null;
function keyAtPoint(x, y) {
  for (const k of keys) {
    const r = k.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return k;
  }
  return null;
}
function onAnimalPointerDown(animalKey, e) {
  if (isBusy) return;
  if (touchDragAnimal !== null) return; // 已有拖拽进行中，忽略其他手指
  // 捕获指针：窗口外松开也能收到 pointerup，避免拖拽卡死
  try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
  touchDragAnimal = animalKey;
  touchDragPointerId = e.pointerId;
  touchDragStartX = e.clientX;
  touchDragStartY = e.clientY;
  touchDragActive = false;
}
function onDocPointerMove(e) {
  if (!touchDragAnimal || e.pointerId !== touchDragPointerId) return;
  if (!touchDragActive) {
    if (Math.abs(e.clientX - touchDragStartX) < 10 && Math.abs(e.clientY - touchDragStartY) < 10) return;
    touchDragActive = true;
    touchDragClone = document.createElement('div');
    touchDragClone.style.cssText = 'position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);';
    touchDragClone.innerHTML = animalData[touchDragAnimal].svg;
    document.body.appendChild(touchDragClone);
    document.querySelectorAll('.animal-item').forEach(el => el.classList.toggle('dragging', el.dataset.animal === touchDragAnimal));
  }
  touchDragClone.style.left = e.clientX + 'px';
  touchDragClone.style.top = e.clientY + 'px';
  e.preventDefault();
}
function onDocPointerUp(e) {
  if (!touchDragAnimal || e.pointerId !== touchDragPointerId) return;
  if (touchDragActive && touchDragClone) {
    const keyEl = keyAtPoint(e.clientX, e.clientY);
    document.body.removeChild(touchDragClone);
    touchDragClone = null;
    document.querySelectorAll('.animal-item').forEach(el => el.classList.remove('dragging'));
    if (keyEl) {
      handlePlace(touchDragAnimal, keyEl);
    } else if (currentKbLevel === 3) {
      successMsg.innerHTML = '👆 请拖到亮起的琴键上 <span class="en">Please drop onto the lit piano key</span>';
      playBeep(220, 0.2);
    } else if (currentKbLevel === 2) {
      successMsg.innerHTML = '没放到琴键上，再拖一次对准琴键 <span class="en">Drop it onto a piano key</span>';
      playBeep(220, 0.2);
    } else {
      successMsg.innerHTML = '可以点选小动物再点琴键哦 <span class="en">Tap the animal, then tap its key</span>';
    }
  }
  touchDragAnimal = null;
  touchDragActive = false;
  touchDragPointerId = null;
}
function onDocPointerCancel(e) {
  if (!touchDragAnimal || e.pointerId !== touchDragPointerId) return;
  if (touchDragClone) {
    touchDragClone.remove();
    touchDragClone = null;
  }
  document.querySelectorAll('.animal-item').forEach(el => el.classList.remove('dragging'));
  touchDragAnimal = null;
  touchDragActive = false;
  touchDragPointerId = null;
}
document.addEventListener('pointermove', onDocPointerMove);
document.addEventListener('pointerup', onDocPointerUp);
document.addEventListener('pointercancel', onDocPointerCancel);

// ========== 大项目/小项目导航 ==========
const projectSelect = document.getElementById('projectSelect');
const projectBeat = document.getElementById('projectBeat');
const projectKeyboard = document.getElementById('projectKeyboard');
const panelBeat = document.getElementById('beatPanel');
const panelKeyboard = document.getElementById('keyboardPanel');
function interruptMelody() {
  if (isPlayingFullMelody) {
    // 整曲示范被打断：直接推进到下一首开头（与 playFullMelody 末尾一致），隐藏面板不发声
    clearKbTimers();
    isPlayingFullMelody = false;
    currentSongIndex = (currentSongIndex + 1) % songList.length;
    currentSegmentIndex = 0;
    taskIndex = 0;
    updateSongButtons();
    isBusy = false;
    renderMelody(true);
  } else if (isPlayingSegmentDemo) {
    // 段落示范被打断：静默进入下一段（最后一段则跳过整曲示范）
    clearKbTimers();
    isPlayingSegmentDemo = false;
    isBusy = false;
    afterSegmentDemo(true);
  }
  // 答题反馈中的短计时器保留，会在面板隐藏时静默完成推进
}
function showProject(project) {
  projectSelect.classList.add('hidden');
  panelBeat.classList.toggle('active', project === 'beat');
  panelKeyboard.classList.toggle('active', project === 'keyboard');
}
function showProjectSelect() {
  interruptMelody();
  projectSelect.classList.remove('hidden');
  panelBeat.classList.remove('active');
  panelKeyboard.classList.remove('active');
}
projectBeat.addEventListener('click', ()=> showProject('beat'));
projectKeyboard.addEventListener('click', ()=> showProject('keyboard'));
document.querySelectorAll('.back-btn').forEach(btn=>{
  btn.addEventListener('click', showProjectSelect);
});

// 初始化
showProjectSelect();
loadBeatStage('learn');
switchKbLevel(1);
</script>
